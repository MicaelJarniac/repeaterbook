[project]
name = "repeaterbook"
version = "0.10.2"
description = "Unofficial third-party Python client and MCP server for the RepeaterBook.com API."
authors = [
  {name = "Micael Jarniac", email = "micael@jarniac.dev"},
]
license = {text = "MIT"}
readme = "docs/README.md"
keywords = [
  "repeaterbook",
  "ham-radio",
  "amateur-radio",
  "repeater",
  "mcp",
  "model-context-protocol",
  "fastmcp",
  "dmr",
]
classifiers = [
  # Get more from http://pypi.python.org/pypi?%3Aaction=list_classifiers
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Ham Radio",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
  # https://github.com/astral-sh/uv/issues/8716
  "License :: OSI Approved :: MIT License",
  # Keep in sync with `requires-python` and `.python-versions`.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.11"  # py_ver
dependencies = [
    "aiohttp>=3.11.14",
    "annotated-types>=0.7.0",
    "anyio>=4.9.0",
    "attrs>=25.3.0",
    "haversine>=2.9.0",
    "loguru>=0.7.3",
    "pycountry>=24.6.1",
    # 2.11 for named type aliases (TypeAliasType) emitting shared $defs.
    "pydantic>=2.11",
    "sqlmodel>=0.0.24",
    "tqdm>=4.67.1",
    "typing-extensions>=4.12",
    "yarl>=1.18.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
homepage = "https://github.com/MicaelJarniac/repeaterbook"
source = "https://github.com/MicaelJarniac/repeaterbook"
download = "https://pypi.org/project/repeaterbook/#files"
changelog = "https://github.com/MicaelJarniac/repeaterbook/blob/main/docs/CHANGELOG.md"
documentation = "https://repeaterbook.readthedocs.io"
issues = "https://github.com/MicaelJarniac/repeaterbook/issues"

[project.optional-dependencies]
mcp = [
    "fastmcp>=3.0.0",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.0",
]

[project.scripts]
repeaterbook-mcp = "repeaterbook.mcp.server:main"
repeaterbook-write-schema = "repeaterbook.spec:write_schema"

[dependency-groups]
tests = [
    "coverage>=7.6.11",
    "hypothesis>=6.125.3",
    "inline-snapshot>=0.20.2",
    "jsonschema>=4.26.0",
    "pytest>=8.3.4",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.0.0",
]
benchmarking = [
    "asv>=0.6.4",
    "virtualenv>=20.29.1",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.2",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autorefs>=0.5.0",
]
typing = [
    {include-group = "tests"},
    {include-group = "automation"},
    "mypy>=1.15.0",
    # Typing stubs go here
    "types-tqdm>=4.67.0.20250319",
    "types-jsonschema>=4.26.0",
]
linting = [
    "ruff>=0.9.6",
]
pre-commit = [
    "pre-commit>=4.1.0",
]
release = [
    "python-semantic-release>=10.6.1",
]
automation = [
    "nox[uv]>=2025.2.9",
]
dev = [
    {include-group = "tests"},
    {include-group = "benchmarking"},
    {include-group = "docs"},
    {include-group = "typing"},
    {include-group = "linting"},
    {include-group = "pre-commit"},
    {include-group = "automation"},
    {include-group = "release"},
    "ipython>=8.18.1",
    "pandas>=2.2.3",
    "ipykernel>=6.29.5",
    "rich>=13.9.4",
]

[tool.ruff]
# https://docs.astral.sh/ruff/rules/
line-length = 88  # Default
force-exclude = true
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",
  "D213",
  "COM812",
  "ISC001",
]
unfixable = ["ERA001"]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the point. PLR2004: magic numbers are fixture data.
# S106/S107: "tokens" here are literal test fixtures, not credentials.
"tests/*" = ["S101", "PLR2004", "S106", "S107"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "type"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["src", "docs", "tests", "noxfile.py"]
exclude = [".venv"]
enable_error_code = [
  "ignore-without-code"
]
strict = true
warn_unused_ignores = false  # true
show_column_numbers = true
# show_error_context = true
# pretty = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# The MCP Registry rejects a server.json whose package version is absent from
# PyPI, so the manifest has to carry the version being released. One pattern
# covers both `version` keys in the file (the server's and the package's) --
# they are always the same value.
version_variables = ["server.json:version"]
# Keep releasing 0.x. PSR v10 flipped this default to false, which would
# promote the next release to 1.0.0 and declare the API stable.
allow_zero_version = true
# While pre-1.0, a breaking change bumps the minor rather than promoting to
# 1.0.0. This lets a breaking commit be marked honestly with `!` or a
# BREAKING CHANGE footer without accidentally declaring the API stable;
# reaching 1.0.0 stays a deliberate decision.
major_on_zero = false
build_command = """
  pip install uv
  uv lock
  git add uv.lock
  uv build
"""

[tool.semantic_release.changelog.default_templates]
changelog_file = "docs/CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.rc]
match = "rc"
prerelease = true
prerelease_token = "rc"

[tool.coverage.run]
source = ["src"]
command_line = "-m pytest"

[tool.pytest.ini_options]
# addopts = "--cov"
markers = [
  "integration: hits the live repeaterbook.com API (disabled by default)",
]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[tool.cruft]
skip = [
  "src",
  "tests",
  "benchmarks",
  ".asv",
  "uv.lock",
]
