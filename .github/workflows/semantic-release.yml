name: Semantic Release

on:
  push:
    branches:
      - main
      - rc

jobs:
  Release:
    runs-on: ubuntu-latest
    concurrency: release

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - run: |
          git checkout -B ${{ github.ref_name }} ${{ github.sha }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Run semantic-release from the locked environment rather than the
      # published action. The action builds its own image and resolves
      # gitpython~=3.0 at build time, so GitPython 3.1.60 -- which removed
      # Actor.name_email_regex, an attribute PSR reads on every config load --
      # breaks it from the outside, at every PSR version. Upstream:
      # https://github.com/python-semantic-release/python-semantic-release/issues/1476
      #
      # Our lockfile pins a working GitPython, so this keeps releases
      # reproducible and lets Dependabot bump both in step. Revert to the
      # action once the fix ships.
      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          uv sync --frozen --no-default-groups --only-group=release
          uv run --no-sync semantic-release version

      # Same reason as the release step above: publish-action is also a
      # Docker action and resolves the broken GitPython at build time.
      - name: Publish package to GitHub
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync semantic-release publish --tag "${{ steps.release.outputs.tag }}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.released == 'true'

      # Must run after the PyPI upload: the registry validates that the
      # server.json package version actually exists on PyPI, and reads the
      # `mcp-name:` ownership token out of the rendered package description.
      # `login github-oidc` needs the `id-token: write` permission granted
      # above, and mints `io.github.<repository_owner>/*` -- which is why the
      # `name` in server.json must match the owner's casing exactly.
      - name: Publish to MCP Registry
        if: steps.release.outputs.released == 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # A freshly uploaded release can take a moment to become visible in
          # PyPI's metadata API, which surfaces as a validation failure rather
          # than a transient network error, so retry before giving up.
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Publish attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          exit 1
